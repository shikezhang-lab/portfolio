<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 690" role="img" aria-labelledby="title desc"><title id="title">SitePilot 产品架构图</title><desc id="desc">设备端评估与存储、可选云端 AI 和购买记账分别承担独立职责。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#1670b7"/></marker></defs><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#071e3d}.muted{fill:#536273}.blue{fill:#1670b7}</style><rect width="100%" height="100%" fill="white"/><text x="26" y="35" text-anchor="start" font-size="18" font-weight="650" class=""><tspan x="26" dy="0">产品架构 / 职责边界</tspan></text><rect x="24" y="60" width="465" height="530" fill="#edf3f8" stroke="#c8d1da"/><text x="42" y="89" text-anchor="start" font-size="15" font-weight="650" class=""><tspan x="42" dy="0">设备端 · iOS / SwiftUI</tspan></text><rect x="42" y="108" width="429" height="88" rx="2" fill="#ffffff" stroke="#c8d1da"/><text x="58" y="135" text-anchor="start" font-size="16" font-weight="650" class=""><tspan x="58" dy="0">用户功能层</tspan></text><text x="58" y="161" text-anchor="start" font-size="13" font-weight="400" class="muted"><tspan x="58" dy="0">录入 → 评估 → 决策 → 导出</tspan><tspan x="58" dy="18.849999999999998">尽调清单 · 可选 AI · 购买与恢复</tspan></text><line x1="255" y1="196" x2="255" y2="220" stroke="#1670b7" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="42" y="222" width="429" height="101" rx="2" fill="#ffffff" stroke="#c8d1da"/><text x="58" y="249" text-anchor="start" font-size="16" font-weight="650" class=""><tspan x="58" dy="0">本地确定性评估</tspan></text><text x="58" y="275" text-anchor="start" font-size="13" font-weight="400" class="muted"><tspan x="58" dy="0">财务引擎 · 敏感性情景 · 评分 · 可行性门禁</tspan><tspan x="58" dy="18.849999999999998">DraftService 编排报告生成</tspan><tspan x="58" dy="18.849999999999998">当前报告路径使用内置 Austin 规则包</tspan></text><line x1="255" y1="323" x2="255" y2="349" stroke="#1670b7" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="42" y="351" width="429" height="77" rx="2" fill="#ffffff" stroke="#c8d1da"/><text x="58" y="378" text-anchor="start" font-size="16" font-weight="650" class=""><tspan x="58" dy="0">本地数据层</tspan></text><text x="58" y="404" text-anchor="start" font-size="13" font-weight="400" class="muted"><tspan x="58" dy="0">SwiftData：草稿 + 冻结报告快照</tspan></text><rect x="42" y="451" width="429" height="112" rx="2" fill="#ffffff" stroke="#c8d1da"/><text x="58" y="478" text-anchor="start" font-size="16" font-weight="650" class=""><tspan x="58" dy="0">云端与商业化编排</tspan></text><text x="58" y="504" text-anchor="start" font-size="13" font-weight="400" class="muted"><tspan x="58" dy="0">SiteAIEnricher · 签名 API 请求</tspan><tspan x="58" dy="18.849999999999998">StoreKit 2 适配器 · Keychain 权益缓存</tspan><tspan x="58" dy="18.849999999999998">UserDefaults：待补发购买账本队列</tspan></text><rect x="589" y="60" width="270" height="530" fill="#f7f9fb" stroke="#c8d1da"/><text x="605" y="89" text-anchor="start" font-size="15" font-weight="650" class=""><tspan x="605" dy="0">CLOUDFLARE WORKER</tspan></text><rect x="605" y="108" width="238" height="101" rx="2" fill="#ffffff" stroke="#c8d1da"/><text x="621" y="135" text-anchor="start" font-size="16" font-weight="650" class=""><tspan x="621" dy="0">请求入口</tspan></text><text x="621" y="161" text-anchor="start" font-size="13" font-weight="400" class="muted"><tspan x="621" dy="0">HMAC 与时间戳校验</tspan><tspan x="621" dy="18.849999999999998">AI 熔断开关 · 请求体限制</tspan></text><rect x="605" y="233" width="238" height="104" rx="2" fill="#ffffff" stroke="#c8d1da"/><text x="621" y="260" text-anchor="start" font-size="16" font-weight="650" class=""><tspan x="621" dy="0">AI 网关</tspan></text><text x="621" y="286" text-anchor="start" font-size="13" font-weight="400" class="muted"><tspan x="621" dy="0">/v1/report</tspan><tspan x="621" dy="18.849999999999998">缓存 · 配额／限流</tspan><tspan x="621" dy="18.849999999999998">解析模型响应</tspan></text><rect x="605" y="365" width="238" height="90" rx="2" fill="#ffffff" stroke="#c8d1da"/><text x="621" y="392" text-anchor="start" font-size="16" font-weight="650" class=""><tspan x="621" dy="0">购买账本</tspan></text><text x="621" y="418" text-anchor="start" font-size="13" font-weight="400" class="muted"><tspan x="621" dy="0">/v1/record · /v1/balance</tspan><tspan x="621" dy="18.849999999999998">Apple 通知（ASN V2）</tspan></text><rect x="605" y="487" width="238" height="76" rx="2" fill="#ffffff" stroke="#c8d1da"/><text x="621" y="514" text-anchor="start" font-size="16" font-weight="650" class=""><tspan x="621" dy="0">Cloudflare KV</tspan></text><text x="621" y="540" text-anchor="start" font-size="13" font-weight="400" class="muted"><tspan x="621" dy="0">交易记录 · 配额计数 · 缓存</tspan></text><line x1="724" y1="455" x2="724" y2="487" stroke="#1670b7" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M843 303 H851 V524 H843" fill="none" stroke="#1670b7" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="925" y="233" width="151" height="104" rx="2" fill="#ffffff" stroke="#c8d1da"/><text x="941" y="260" text-anchor="start" font-size="16" font-weight="650" class=""><tspan x="941" dy="0">LLM 服务</tspan></text><text x="941" y="286" text-anchor="start" font-size="13" font-weight="400" class="muted"><tspan x="941" dy="0">仅提供定性辅助</tspan><tspan x="941" dy="18.849999999999998">不计算基础分</tspan></text><rect x="925" y="365" width="151" height="90" rx="2" fill="#ffffff" stroke="#c8d1da"/><text x="941" y="392" text-anchor="start" font-size="16" font-weight="650" class=""><tspan x="941" dy="0">Apple</tspan></text><text x="941" y="418" text-anchor="start" font-size="13" font-weight="400" class="muted"><tspan x="941" dy="0">StoreKit 购买</tspan><tspan x="941" dy="18.849999999999998">服务端通知</tspan></text><line x1="843" y1="280" x2="925" y2="280" stroke="#1670b7" stroke-width="1.5" marker-end="url(#arrow)"/><text x="884" y="264" text-anchor="middle" font-size="12" font-weight="400" class="blue"><tspan x="884" dy="0">AI</tspan></text><line x1="925" y1="410" x2="843" y2="410" stroke="#1670b7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="884" y="392" text-anchor="middle" font-size="11" font-weight="400" class="blue"><tspan x="884" dy="0">ASN V2</tspan></text><line x1="471" y1="484" x2="605" y2="156" stroke="#1670b7" stroke-width="1.5" marker-end="url(#arrow)"/><text x="530" y="330" text-anchor="middle" font-size="12" font-weight="400" class="blue"><tspan x="530" dy="0">签名请求</tspan></text><text x="530" y="348" text-anchor="middle" font-size="12" font-weight="400" class="blue"><tspan x="530" dy="0">按需调用</tspan></text><path d="M471 537 H554 V410 H605" fill="none" stroke="#1670b7" stroke-width="1.5" marker-end="url(#arrow)"/><text x="540" y="571" text-anchor="middle" font-size="11" font-weight="400" class="blue"><tspan x="540" dy="0">账本同步</tspan></text><path d="M450 563 V610 H1000 V455" fill="none" stroke="#1670b7" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="737" y="604" text-anchor="middle" font-size="12" font-weight="400" class="blue"><tspan x="737" dy="0">StoreKit 购买／恢复 · 设备端验签</tspan></text><text x="26" y="646" text-anchor="start" font-size="14" font-weight="650" class=""><tspan x="26" dy="0">核心报告无需云端调用；AI 不覆盖确定性结果。</tspan></text><text x="26" y="672" text-anchor="start" font-size="12" font-weight="400" class="muted"><tspan x="26" dy="0">配置能力：远程规则包刷新／回滚；不将其画作当前报告已接通的自动更新。</tspan></text><line x1="724" y1="209" x2="724" y2="233" stroke="#1670b7" stroke-width="1.5" marker-end="url(#arrow)"/></svg>