<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1180" role="img" aria-labelledby="title desc"><title id="title">User interaction sequence</title><desc id="desc">Local report first; optional AI only after feasibility, configuration and local quota checks. Errors preserve the local report.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#1670b7"/></marker></defs><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#071e3d}.muted{fill:#536273}.blue{fill:#1670b7}</style><rect width="100%" height="100%" fill="white"/><text x="24" y="34" text-anchor="start" font-size="18" font-weight="650" class=""><tspan x="24" dy="0">USER JOURNEY / LOCAL REPORT → OPTIONAL AI</tspan></text><rect x="13" y="58" width="144" height="42" fill="#edf3f8" stroke="#c8d1da"/><text x="85" y="84" text-anchor="middle" font-size="14" font-weight="650" class=""><tspan x="85" dy="0">User</tspan></text><line x1="85" y1="100" x2="85" y2="1120" stroke="#c8d1da" stroke-dasharray="5 5"/><rect x="199" y="58" width="144" height="42" fill="#edf3f8" stroke="#c8d1da"/><text x="271" y="84" text-anchor="middle" font-size="14" font-weight="650" class=""><tspan x="271" dy="0">App UI</tspan></text><line x1="271" y1="100" x2="271" y2="1120" stroke="#c8d1da" stroke-dasharray="5 5"/><rect x="385" y="58" width="144" height="42" fill="#edf3f8" stroke="#c8d1da"/><text x="457" y="84" text-anchor="middle" font-size="14" font-weight="650" class=""><tspan x="457" dy="0">Local engine</tspan></text><line x1="457" y1="100" x2="457" y2="1120" stroke="#c8d1da" stroke-dasharray="5 5"/><rect x="571" y="58" width="144" height="42" fill="#edf3f8" stroke="#c8d1da"/><text x="643" y="84" text-anchor="middle" font-size="14" font-weight="650" class=""><tspan x="643" dy="0">Local storage</tspan></text><line x1="643" y1="100" x2="643" y2="1120" stroke="#c8d1da" stroke-dasharray="5 5"/><rect x="757" y="58" width="144" height="42" fill="#edf3f8" stroke="#c8d1da"/><text x="829" y="84" text-anchor="middle" font-size="14" font-weight="650" class=""><tspan x="829" dy="0">Worker</tspan></text><line x1="829" y1="100" x2="829" y2="1120" stroke="#c8d1da" stroke-dasharray="5 5"/><rect x="943" y="58" width="144" height="42" fill="#edf3f8" stroke="#c8d1da"/><text x="1015" y="84" text-anchor="middle" font-size="14" font-weight="650" class=""><tspan x="1015" dy="0">LLM</tspan></text><line x1="1015" y1="100" x2="1015" y2="1120" stroke="#c8d1da" stroke-dasharray="5 5"/><line x1="85" y1="145" x2="271" y2="145" stroke="#1670b7" stroke-width="1.5" marker-end="url(#arrow)"/><text x="178.0" y="136" text-anchor="middle" font-size="12" font-weight="400" class=""><tspan x="178.0" dy="0">Enter site + diligence</tspan></text><line x1="271" y1="235" x2="643" y2="235" stroke="#1670b7" stroke-width="1.5" marker-end="url(#arrow)"/><text x="457.0" y="226" text-anchor="middle" font-size="12" font-weight="400" class=""><tspan x="457.0" dy="0">Save draft inputs</tspan></text><line x1="85" y1="188" x2="271" y2="188" stroke="#1670b7" stroke-width="1.5" marker-end="url(#arrow)"/><text x="178.0" y="179" text-anchor="middle" font-size="12" font-weight="400" class=""><tspan x="178.0" dy="0">Generate report</tspan></text><line x1="271" y1="279" x2="457" y2="279" stroke="#1670b7" stroke-width="1.5" marker-end="url(#arrow)"/><text x="364.0" y="270" text-anchor="middle" font-size="12" font-weight="400" class=""><tspan x="364.0" dy="0">Validate + evaluate</tspan></text><line x1="457" y1="323" x2="271" y2="323" stroke="#1670b7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="364.0" y="314" text-anchor="middle" font-size="12" font-weight="400" class=""><tspan x="364.0" dy="0">Scenarios + gate result</tspan></text><line x1="271" y1="368" x2="643" y2="368" stroke="#1670b7" stroke-width="1.5" marker-end="url(#arrow)"/><text x="457.0" y="359" text-anchor="middle" font-size="12" font-weight="400" class=""><tspan x="457.0" dy="0">Freeze results + rule version</tspan></text><line x1="643" y1="412" x2="271" y2="412" stroke="#1670b7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="457.0" y="403" text-anchor="middle" font-size="12" font-weight="400" class=""><tspan x="457.0" dy="0">Frozen snapshot</tspan></text><line x1="271" y1="456" x2="85" y2="456" stroke="#1670b7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="178.0" y="447" text-anchor="middle" font-size="12" font-weight="400" class=""><tspan x="178.0" dy="0">View report / export</tspan></text><rect x="22" y="480" width="1056" height="34" fill="#edf3f8" stroke="#c8d1da"/><text x="34" y="502" text-anchor="start" font-size="12" font-weight="400" class=""><tspan x="34" dy="0">Invalid input → show correction prompt; no new report. History → render the saved snapshot.</tspan></text><rect x="22" y="532" width="1056" height="34" fill="#edf3f8" stroke="#c8d1da"/><text x="34" y="554" text-anchor="start" font-size="12" font-weight="400" class=""><tspan x="34" dy="0">Gate blocked or AI unconfigured → local report stays available; no AI request is sent.</tspan></text><rect x="22" y="590" width="1056" height="498" fill="none" stroke="#1670b7"/><rect x="22" y="590" width="1056" height="34" fill="#edf3f8" stroke="#c8d1da"/><text x="34" y="612" text-anchor="start" font-size="12" font-weight="400" class=""><tspan x="34" dy="0">opt · Gate allows AI + service configured + user explicitly requests it</tspan></text><line x1="85" y1="664" x2="271" y2="664" stroke="#1670b7" stroke-width="1.5" marker-end="url(#arrow)"/><text x="178.0" y="655" text-anchor="middle" font-size="12" font-weight="400" class=""><tspan x="178.0" dy="0">Request AI assistance</tspan></text><rect x="188" y="681" width="567" height="34" fill="#edf3f8" stroke="#c8d1da"/><text x="200" y="703" text-anchor="start" font-size="12" font-weight="400" class=""><tspan x="200" dy="0">Check local credits → reserve one use (annual plan: unlimited)</tspan></text><rect x="188" y="727" width="567" height="34" fill="#fff5e9" stroke="#c8d1da"/><text x="200" y="749" text-anchor="start" font-size="12" font-weight="400" class=""><tspan x="200" dy="0">alt · No credits → prompt user; stop before network request</tspan></text><line x1="271" y1="799" x2="829" y2="799" stroke="#1670b7" stroke-width="1.5" marker-end="url(#arrow)"/><text x="550.0" y="790" text-anchor="middle" font-size="12" font-weight="400" class=""><tspan x="550.0" dy="0">Signed derived summary + sanitized notes</tspan></text><rect x="728" y="817" width="350" height="34" fill="#edf3f8" stroke="#c8d1da"/><text x="740" y="839" text-anchor="start" font-size="12" font-weight="400" class=""><tspan x="740" dy="0">Verify → cache → limits → model</tspan></text><line x1="829" y1="890" x2="1015" y2="890" stroke="#1670b7" stroke-width="1.5" marker-end="url(#arrow)"/><text x="922.0" y="881" text-anchor="middle" font-size="12" font-weight="400" class=""><tspan x="922.0" dy="0">Generate assistance</tspan></text><line x1="1015" y1="934" x2="829" y2="934" stroke="#1670b7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="922.0" y="925" text-anchor="middle" font-size="12" font-weight="400" class=""><tspan x="922.0" dy="0">Model response</tspan></text><line x1="829" y1="978" x2="271" y2="978" stroke="#1670b7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="550.0" y="969" text-anchor="middle" font-size="12" font-weight="400" class=""><tspan x="550.0" dy="0">Parsed response (cache hit skips model)</tspan></text><line x1="271" y1="1022" x2="85" y2="1022" stroke="#1670b7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="178.0" y="1013" text-anchor="middle" font-size="12" font-weight="400" class=""><tspan x="178.0" dy="0">Show AI separately</tspan></text><rect x="188" y="1040" width="867" height="34" fill="#fff5e9" stroke="#c8d1da"/><text x="200" y="1062" text-anchor="start" font-size="12" font-weight="400" class=""><tspan x="200" dy="0">alt · Request ultimately fails → restore local credit balance; keep the local report.</tspan></text><text x="24" y="1134" text-anchor="start" font-size="13" font-weight="650" class=""><tspan x="24" dy="0">AI does not rewrite the report snapshot or deterministic score. Purchase / restore is a separate user action.</tspan></text><text x="24" y="1161" text-anchor="start" font-size="12" font-weight="400" class="muted"><tspan x="24" dy="0">Local-credit rollback does not claim rollback of server rate-limit counters.</tspan></text></svg>