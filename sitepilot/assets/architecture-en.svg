<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 690" role="img" aria-labelledby="title desc"><title id="title">SitePilot product architecture</title><desc id="desc">Device-local evaluation and storage, optional cloud AI, and purchase bookkeeping are separate responsibilities.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#1670b7"/></marker></defs><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#071e3d}.muted{fill:#536273}.blue{fill:#1670b7}</style><rect width="100%" height="100%" fill="white"/><text x="26" y="35" text-anchor="start" font-size="18" font-weight="650" class=""><tspan x="26" dy="0">PRODUCT ARCHITECTURE / RESPONSIBILITY BOUNDARIES</tspan></text><rect x="24" y="60" width="465" height="530" fill="#edf3f8" stroke="#c8d1da"/><text x="42" y="89" text-anchor="start" font-size="15" font-weight="650" class=""><tspan x="42" dy="0">ON DEVICE · iOS / SwiftUI</tspan></text><rect x="42" y="108" width="429" height="88" rx="2" fill="#ffffff" stroke="#c8d1da"/><text x="58" y="135" text-anchor="start" font-size="16" font-weight="650" class=""><tspan x="58" dy="0">User experience</tspan></text><text x="58" y="161" text-anchor="start" font-size="13" font-weight="400" class="muted"><tspan x="58" dy="0">Capture → evaluate → decide → export</tspan><tspan x="58" dy="18.849999999999998">Diligence checklist · optional AI · purchase / restore</tspan></text><line x1="255" y1="196" x2="255" y2="220" stroke="#1670b7" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="42" y="222" width="429" height="101" rx="2" fill="#ffffff" stroke="#c8d1da"/><text x="58" y="249" text-anchor="start" font-size="16" font-weight="650" class=""><tspan x="58" dy="0">Deterministic evaluation</tspan></text><text x="58" y="275" text-anchor="start" font-size="13" font-weight="400" class="muted"><tspan x="58" dy="0">FinancialEngine · scenarios · scoring · feasibility gate</tspan><tspan x="58" dy="18.849999999999998">DraftService coordinates report generation</tspan><tspan x="58" dy="18.849999999999998">Current report path: bundled Austin rule pack</tspan></text><line x1="255" y1="323" x2="255" y2="349" stroke="#1670b7" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="42" y="351" width="429" height="77" rx="2" fill="#ffffff" stroke="#c8d1da"/><text x="58" y="378" text-anchor="start" font-size="16" font-weight="650" class=""><tspan x="58" dy="0">Local persistence</tspan></text><text x="58" y="404" text-anchor="start" font-size="13" font-weight="400" class="muted"><tspan x="58" dy="0">SwiftData: drafts + frozen report snapshots</tspan></text><rect x="42" y="451" width="429" height="112" rx="2" fill="#ffffff" stroke="#c8d1da"/><text x="58" y="478" text-anchor="start" font-size="16" font-weight="650" class=""><tspan x="58" dy="0">Cloud &amp; commerce coordination</tspan></text><text x="58" y="504" text-anchor="start" font-size="13" font-weight="400" class="muted"><tspan x="58" dy="0">SiteAIEnricher · signed API requests</tspan><tspan x="58" dy="18.849999999999998">StoreKit 2 adapter · Keychain entitlement cache</tspan><tspan x="58" dy="18.849999999999998">UserDefaults: pending purchase-ledger outbox</tspan></text><rect x="589" y="60" width="270" height="530" fill="#f7f9fb" stroke="#c8d1da"/><text x="605" y="89" text-anchor="start" font-size="15" font-weight="650" class=""><tspan x="605" dy="0">CLOUDFLARE WORKER</tspan></text><rect x="605" y="108" width="238" height="101" rx="2" fill="#ffffff" stroke="#c8d1da"/><text x="621" y="135" text-anchor="start" font-size="16" font-weight="650" class=""><tspan x="621" dy="0">Request boundary</tspan></text><text x="621" y="161" text-anchor="start" font-size="13" font-weight="400" class="muted"><tspan x="621" dy="0">HMAC + timestamp validation</tspan><tspan x="621" dy="18.849999999999998">Kill switch · body limits</tspan></text><rect x="605" y="233" width="238" height="104" rx="2" fill="#ffffff" stroke="#c8d1da"/><text x="621" y="260" text-anchor="start" font-size="16" font-weight="650" class=""><tspan x="621" dy="0">AI gateway</tspan></text><text x="621" y="286" text-anchor="start" font-size="13" font-weight="400" class="muted"><tspan x="621" dy="0">/v1/report</tspan><tspan x="621" dy="18.849999999999998">Cache · quota / rate limits</tspan><tspan x="621" dy="18.849999999999998">Parse model response</tspan></text><rect x="605" y="365" width="238" height="90" rx="2" fill="#ffffff" stroke="#c8d1da"/><text x="621" y="392" text-anchor="start" font-size="16" font-weight="650" class=""><tspan x="621" dy="0">Purchase ledger</tspan></text><text x="621" y="418" text-anchor="start" font-size="13" font-weight="400" class="muted"><tspan x="621" dy="0">/v1/record · /v1/balance</tspan><tspan x="621" dy="18.849999999999998">Apple notifications (ASN V2)</tspan></text><rect x="605" y="487" width="238" height="76" rx="2" fill="#ffffff" stroke="#c8d1da"/><text x="621" y="514" text-anchor="start" font-size="16" font-weight="650" class=""><tspan x="621" dy="0">Cloudflare KV</tspan></text><text x="621" y="540" text-anchor="start" font-size="13" font-weight="400" class="muted"><tspan x="621" dy="0">Transactions · counters · cache</tspan></text><line x1="724" y1="455" x2="724" y2="487" stroke="#1670b7" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M843 303 H851 V524 H843" fill="none" stroke="#1670b7" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="925" y="233" width="151" height="104" rx="2" fill="#ffffff" stroke="#c8d1da"/><text x="941" y="260" text-anchor="start" font-size="16" font-weight="650" class=""><tspan x="941" dy="0">LLM provider</tspan></text><text x="941" y="286" text-anchor="start" font-size="13" font-weight="400" class="muted"><tspan x="941" dy="0">Qualitative</tspan><tspan x="941" dy="18.849999999999998">assistance only</tspan></text><rect x="925" y="365" width="151" height="90" rx="2" fill="#ffffff" stroke="#c8d1da"/><text x="941" y="392" text-anchor="start" font-size="16" font-weight="650" class=""><tspan x="941" dy="0">Apple</tspan></text><text x="941" y="418" text-anchor="start" font-size="13" font-weight="400" class="muted"><tspan x="941" dy="0">StoreKit purchase</tspan><tspan x="941" dy="18.849999999999998">Server notifications</tspan></text><line x1="843" y1="280" x2="925" y2="280" stroke="#1670b7" stroke-width="1.5" marker-end="url(#arrow)"/><text x="884" y="264" text-anchor="middle" font-size="12" font-weight="400" class="blue"><tspan x="884" dy="0">AI</tspan></text><line x1="925" y1="410" x2="843" y2="410" stroke="#1670b7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="884" y="392" text-anchor="middle" font-size="11" font-weight="400" class="blue"><tspan x="884" dy="0">ASN V2</tspan></text><line x1="471" y1="484" x2="605" y2="156" stroke="#1670b7" stroke-width="1.5" marker-end="url(#arrow)"/><text x="530" y="330" text-anchor="middle" font-size="12" font-weight="400" class="blue"><tspan x="530" dy="0">Signed</tspan></text><text x="530" y="348" text-anchor="middle" font-size="12" font-weight="400" class="blue"><tspan x="530" dy="0">requests</tspan></text><path d="M471 537 H554 V410 H605" fill="none" stroke="#1670b7" stroke-width="1.5" marker-end="url(#arrow)"/><text x="540" y="571" text-anchor="middle" font-size="11" font-weight="400" class="blue"><tspan x="540" dy="0">Ledger sync</tspan></text><path d="M450 563 V610 H1000 V455" fill="none" stroke="#1670b7" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="737" y="604" text-anchor="middle" font-size="12" font-weight="400" class="blue"><tspan x="737" dy="0">StoreKit purchase / restore · verified on device</tspan></text><text x="26" y="646" text-anchor="start" font-size="14" font-weight="650" class=""><tspan x="26" dy="0">Core reports need no cloud call. AI cannot overwrite deterministic results.</tspan></text><text x="26" y="672" text-anchor="start" font-size="12" font-weight="400" class="muted"><tspan x="26" dy="0">Configured capability: remote rule-pack refresh / rollback. Not shown as active report wiring.</tspan></text><line x1="724" y1="209" x2="724" y2="233" stroke="#1670b7" stroke-width="1.5" marker-end="url(#arrow)"/></svg>