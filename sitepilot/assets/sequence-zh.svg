<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1180" role="img" aria-labelledby="title desc"><title id="title">用户交互流程时序图</title><desc id="desc">先生成本地报告；通过门禁、配置与本地额度检查后，才可主动请求 AI；失败保留本地报告。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#1670b7"/></marker></defs><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#071e3d}.muted{fill:#536273}.blue{fill:#1670b7}</style><rect width="100%" height="100%" fill="white"/><text x="24" y="34" text-anchor="start" font-size="18" font-weight="650" class=""><tspan x="24" dy="0">用户交互 / 本地报告 → 可选 AI</tspan></text><rect x="13" y="58" width="144" height="42" fill="#edf3f8" stroke="#c8d1da"/><text x="85" y="84" text-anchor="middle" font-size="14" font-weight="650" class=""><tspan x="85" dy="0">用户</tspan></text><line x1="85" y1="100" x2="85" y2="1120" stroke="#c8d1da" stroke-dasharray="5 5"/><rect x="199" y="58" width="144" height="42" fill="#edf3f8" stroke="#c8d1da"/><text x="271" y="84" text-anchor="middle" font-size="14" font-weight="650" class=""><tspan x="271" dy="0">App 界面</tspan></text><line x1="271" y1="100" x2="271" y2="1120" stroke="#c8d1da" stroke-dasharray="5 5"/><rect x="385" y="58" width="144" height="42" fill="#edf3f8" stroke="#c8d1da"/><text x="457" y="84" text-anchor="middle" font-size="14" font-weight="650" class=""><tspan x="457" dy="0">本地引擎</tspan></text><line x1="457" y1="100" x2="457" y2="1120" stroke="#c8d1da" stroke-dasharray="5 5"/><rect x="571" y="58" width="144" height="42" fill="#edf3f8" stroke="#c8d1da"/><text x="643" y="84" text-anchor="middle" font-size="14" font-weight="650" class=""><tspan x="643" dy="0">本地存储</tspan></text><line x1="643" y1="100" x2="643" y2="1120" stroke="#c8d1da" stroke-dasharray="5 5"/><rect x="757" y="58" width="144" height="42" fill="#edf3f8" stroke="#c8d1da"/><text x="829" y="84" text-anchor="middle" font-size="14" font-weight="650" class=""><tspan x="829" dy="0">Worker</tspan></text><line x1="829" y1="100" x2="829" y2="1120" stroke="#c8d1da" stroke-dasharray="5 5"/><rect x="943" y="58" width="144" height="42" fill="#edf3f8" stroke="#c8d1da"/><text x="1015" y="84" text-anchor="middle" font-size="14" font-weight="650" class=""><tspan x="1015" dy="0">大模型</tspan></text><line x1="1015" y1="100" x2="1015" y2="1120" stroke="#c8d1da" stroke-dasharray="5 5"/><line x1="85" y1="145" x2="271" y2="145" stroke="#1670b7" stroke-width="1.5" marker-end="url(#arrow)"/><text x="178.0" y="136" text-anchor="middle" font-size="12" font-weight="400" class=""><tspan x="178.0" dy="0">录入铺位与尽调</tspan></text><line x1="271" y1="235" x2="643" y2="235" stroke="#1670b7" stroke-width="1.5" marker-end="url(#arrow)"/><text x="457.0" y="226" text-anchor="middle" font-size="12" font-weight="400" class=""><tspan x="457.0" dy="0">保存草稿输入</tspan></text><line x1="85" y1="188" x2="271" y2="188" stroke="#1670b7" stroke-width="1.5" marker-end="url(#arrow)"/><text x="178.0" y="179" text-anchor="middle" font-size="12" font-weight="400" class=""><tspan x="178.0" dy="0">生成报告</tspan></text><line x1="271" y1="279" x2="457" y2="279" stroke="#1670b7" stroke-width="1.5" marker-end="url(#arrow)"/><text x="364.0" y="270" text-anchor="middle" font-size="12" font-weight="400" class=""><tspan x="364.0" dy="0">校验并测算</tspan></text><line x1="457" y1="323" x2="271" y2="323" stroke="#1670b7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="364.0" y="314" text-anchor="middle" font-size="12" font-weight="400" class=""><tspan x="364.0" dy="0">返回情景与门禁结果</tspan></text><line x1="271" y1="368" x2="643" y2="368" stroke="#1670b7" stroke-width="1.5" marker-end="url(#arrow)"/><text x="457.0" y="359" text-anchor="middle" font-size="12" font-weight="400" class=""><tspan x="457.0" dy="0">冻结结果与规则版本</tspan></text><line x1="643" y1="412" x2="271" y2="412" stroke="#1670b7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="457.0" y="403" text-anchor="middle" font-size="12" font-weight="400" class=""><tspan x="457.0" dy="0">返回冻结快照</tspan></text><line x1="271" y1="456" x2="85" y2="456" stroke="#1670b7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="178.0" y="447" text-anchor="middle" font-size="12" font-weight="400" class=""><tspan x="178.0" dy="0">查看报告／导出</tspan></text><rect x="22" y="480" width="1056" height="34" fill="#edf3f8" stroke="#c8d1da"/><text x="34" y="502" text-anchor="start" font-size="12" font-weight="400" class=""><tspan x="34" dy="0">输入无效 → 提示修正，不生成新报告。查看历史 → 直接渲染已存快照。</tspan></text><rect x="22" y="532" width="1056" height="34" fill="#edf3f8" stroke="#c8d1da"/><text x="34" y="554" text-anchor="start" font-size="12" font-weight="400" class=""><tspan x="34" dy="0">门禁阻断或 AI 未配置 → 本地报告仍可用，不发送 AI 请求。</tspan></text><rect x="22" y="590" width="1056" height="498" fill="none" stroke="#1670b7"/><rect x="22" y="590" width="1056" height="34" fill="#edf3f8" stroke="#c8d1da"/><text x="34" y="612" text-anchor="start" font-size="12" font-weight="400" class=""><tspan x="34" dy="0">opt · 门禁允许 + 服务已配置 + 用户主动请求</tspan></text><line x1="85" y1="664" x2="271" y2="664" stroke="#1670b7" stroke-width="1.5" marker-end="url(#arrow)"/><text x="178.0" y="655" text-anchor="middle" font-size="12" font-weight="400" class=""><tspan x="178.0" dy="0">点击 AI 增强</tspan></text><rect x="188" y="681" width="567" height="34" fill="#edf3f8" stroke="#c8d1da"/><text x="200" y="703" text-anchor="start" font-size="12" font-weight="400" class=""><tspan x="200" dy="0">检查本地额度 → 预扣一次（年订阅为不限次）</tspan></text><rect x="188" y="727" width="567" height="34" fill="#fff5e9" stroke="#c8d1da"/><text x="200" y="749" text-anchor="start" font-size="12" font-weight="400" class=""><tspan x="200" dy="0">alt · 额度不足 → 提示用户，停止网络请求</tspan></text><line x1="271" y1="799" x2="829" y2="799" stroke="#1670b7" stroke-width="1.5" marker-end="url(#arrow)"/><text x="550.0" y="790" text-anchor="middle" font-size="12" font-weight="400" class=""><tspan x="550.0" dy="0">发送签名后的派生摘要与清洗备注</tspan></text><rect x="728" y="817" width="350" height="34" fill="#edf3f8" stroke="#c8d1da"/><text x="740" y="839" text-anchor="start" font-size="12" font-weight="400" class=""><tspan x="740" dy="0">验签 → 缓存 → 限额 → 模型</tspan></text><line x1="829" y1="890" x2="1015" y2="890" stroke="#1670b7" stroke-width="1.5" marker-end="url(#arrow)"/><text x="922.0" y="881" text-anchor="middle" font-size="12" font-weight="400" class=""><tspan x="922.0" dy="0">生成辅助分析</tspan></text><line x1="1015" y1="934" x2="829" y2="934" stroke="#1670b7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="922.0" y="925" text-anchor="middle" font-size="12" font-weight="400" class=""><tspan x="922.0" dy="0">模型响应</tspan></text><line x1="829" y1="978" x2="271" y2="978" stroke="#1670b7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="550.0" y="969" text-anchor="middle" font-size="12" font-weight="400" class=""><tspan x="550.0" dy="0">解析后返回（缓存命中则跳过模型）</tspan></text><line x1="271" y1="1022" x2="85" y2="1022" stroke="#1670b7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="178.0" y="1013" text-anchor="middle" font-size="12" font-weight="400" class=""><tspan x="178.0" dy="0">单独展示 AI 内容</tspan></text><rect x="188" y="1040" width="867" height="34" fill="#fff5e9" stroke="#c8d1da"/><text x="200" y="1062" text-anchor="start" font-size="12" font-weight="400" class=""><tspan x="200" dy="0">alt · 请求最终失败 → 回滚本地预扣额度，保留本地报告。</tspan></text><text x="24" y="1134" text-anchor="start" font-size="13" font-weight="650" class=""><tspan x="24" dy="0">AI 不重写报告快照或确定性评分；购买／恢复是独立的用户操作。</tspan></text><text x="24" y="1161" text-anchor="start" font-size="12" font-weight="400" class="muted"><tspan x="24" dy="0">本地额度回滚不代表服务端限流计数也已回滚。</tspan></text></svg>