<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1270" viewBox="0 0 1100 1270" role="img"><title>NovelStudio 用户交互流程时序图</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#1670b7"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#071e3d}.muted{fill:#536273}</style><text x="35" y="43" font-size="25" font-weight="700" text-anchor="start" class="">用户交互流程 · 一次旁白如何影响下一轮对话</text><text x="35" y="74" font-size="14" font-weight="400" text-anchor="start" class="muted">从上往下阅读；实线为请求，虚线为返回。以已进入会话、已连接 AI 服务为起点。</text><rect x="12" y="105" width="226" height="53" rx="3" fill="#edf3f8" stroke="#c8d1da"/><text x="28" y="134" font-size="17" font-weight="700" text-anchor="start" class="">用户</text><path d="M125 158V1200" stroke="#c8d1da" stroke-dasharray="5 5"/><rect x="287" y="105" width="226" height="53" rx="3" fill="#edf3f8" stroke="#c8d1da"/><text x="303" y="134" font-size="17" font-weight="700" text-anchor="start" class="">对话界面与控制</text><path d="M400 158V1200" stroke="#c8d1da" stroke-dasharray="5 5"/><rect x="567" y="105" width="226" height="53" rx="3" fill="#edf3f8" stroke="#c8d1da"/><text x="583" y="134" font-size="17" font-weight="700" text-anchor="start" class="">本地资料与检查</text><path d="M680 158V1200" stroke="#c8d1da" stroke-dasharray="5 5"/><rect x="847" y="105" width="226" height="53" rx="3" fill="#edf3f8" stroke="#c8d1da"/><text x="863" y="134" font-size="17" font-weight="700" text-anchor="start" class="">外部 AI 服务</text><path d="M960 158V1200" stroke="#c8d1da" stroke-dasharray="5 5"/><rect x="30" y="180" width="1040" height="145" fill="#edf3f8" fill-opacity=".7" stroke="#c8d1da"/><text x="45" y="203" font-size="14" font-weight="700" text-anchor="start" class="">可选：先加入导演旁白</text><path d="M125 235 L400 235" stroke="#1670b7" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><text x="262.5" y="225" font-size="14" font-weight="400" text-anchor="middle" class="">加入旁白事件</text><path d="M400 277 L680 277" stroke="#1670b7" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><text x="540.0" y="267" font-size="14" font-weight="400" text-anchor="middle" class="">若启用过滤，先检查；允许后记录</text><text x="420" y="314" font-size="14" font-weight="400" text-anchor="start" class="muted">此时不调用 AI，等下一次提问</text><path d="M125 376 L400 376" stroke="#1670b7" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><text x="262.5" y="366" font-size="14" font-weight="400" text-anchor="middle" class="">发送下一句对话</text><path d="M400 420 L680 420" stroke="#1670b7" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><text x="540.0" y="410" font-size="14" font-weight="400" text-anchor="middle" class="">检查输入（过滤启用时）</text><rect x="30" y="444" width="1040" height="87" fill="#edf3f8" fill-opacity=".7" stroke="#c8d1da"/><text x="45" y="467" font-size="14" font-weight="700" text-anchor="start" class="">分支：输入被拦截</text><path d="M680 500 L400 500" stroke="#1670b7" stroke-width="1.6" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="540.0" y="490" font-size="14" font-weight="400" text-anchor="middle" class="">显示提示，不发送给 AI</text><rect x="30" y="551" width="1040" height="156" fill="#edf3f8" fill-opacity=".7" stroke="#c8d1da"/><text x="45" y="574" font-size="14" font-weight="700" text-anchor="start" class="">允许发送：有来源书籍时查找相关原文</text><path d="M400 613 L680 613" stroke="#1670b7" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><text x="540.0" y="603" font-size="14" font-weight="400" text-anchor="middle" class="">按本轮提问查找相关片段</text><path d="M680 668 L400 668" stroke="#1670b7" stroke-width="1.6" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="540.0" y="658" font-size="14" font-weight="400" text-anchor="middle" class="">返回片段；无来源或无结果时省略</text><text x="400" y="744" font-size="14" font-weight="400" text-anchor="middle" class="">组合角色、片段、旁白、历史与本轮提问</text><path d="M400 790 L960 790" stroke="#1670b7" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><text x="680.0" y="780" font-size="14" font-weight="400" text-anchor="middle" class="">发送生成请求</text><path d="M960 836 L400 836" stroke="#1670b7" stroke-width="1.6" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="680.0" y="826" font-size="14" font-weight="400" text-anchor="middle" class="">逐步返回文本</text><path d="M400 879 L125 879" stroke="#1670b7" stroke-width="1.6" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="262.5" y="869" font-size="14" font-weight="400" text-anchor="middle" class="">逐步展示，用户可停止</text><rect x="30" y="901" width="1040" height="96" fill="#edf3f8" fill-opacity=".7" stroke="#c8d1da"/><text x="45" y="924" font-size="14" font-weight="700" text-anchor="start" class="">结束后：检查输出，再决定最终显示和场景反馈</text><path d="M400 953 L680 953" stroke="#1670b7" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><text x="540.0" y="943" font-size="14" font-weight="400" text-anchor="middle" class="">若启用过滤：保留、遮盖或清空</text><rect x="30" y="1017" width="1040" height="125" fill="#edf3f8" fill-opacity=".7" stroke="#c8d1da"/><text x="45" y="1040" font-size="14" font-weight="700" text-anchor="start" class="">异常与停止</text><path d="M125 1068 L400 1068" stroke="#1670b7" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><text x="262.5" y="1058" font-size="14" font-weight="400" text-anchor="middle" class="">停止 → 取消；保留已显示片段*</text><path d="M400 1118 L125 1118" stroke="#1670b7" stroke-width="1.6" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="262.5" y="1108" font-size="14" font-weight="400" text-anchor="middle" class="">请求失败 → 显示失败原因</text><text x="40" y="1194" font-size="14" font-weight="400" text-anchor="start" class="">* 停止后的文本仍经过适用的输出检查；检查可能清空或遮盖内容。</text><text x="40" y="1225" font-size="14" font-weight="400" text-anchor="start" class="muted">范围：依据 ChatViewModel、PromptAssembler 与检索逻辑绘制，不将逐步显示误画为展示前审核。</text></svg>