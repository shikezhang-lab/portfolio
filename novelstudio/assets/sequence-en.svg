<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1270" viewBox="0 0 1100 1270" role="img"><title>NovelStudio user interaction sequence</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#1670b7"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#071e3d}.muted{fill:#536273}</style><text x="35" y="43" font-size="25" font-weight="700" text-anchor="start" class="">Interaction sequence · How narration shapes the next turn</text><text x="35" y="74" font-size="14" font-weight="400" text-anchor="start" class="muted">Read top to bottom. Solid: request; dashed: response. Starts with a chat and AI connection ready.</text><rect x="12" y="105" width="226" height="53" rx="3" fill="#edf3f8" stroke="#c8d1da"/><text x="28" y="134" font-size="17" font-weight="700" text-anchor="start" class="">User</text><path d="M125 158V1200" stroke="#c8d1da" stroke-dasharray="5 5"/><rect x="287" y="105" width="226" height="53" rx="3" fill="#edf3f8" stroke="#c8d1da"/><text x="303" y="134" font-size="17" font-weight="700" text-anchor="start" class="">Chat UI and controller</text><path d="M400 158V1200" stroke="#c8d1da" stroke-dasharray="5 5"/><rect x="567" y="105" width="226" height="53" rx="3" fill="#edf3f8" stroke="#c8d1da"/><text x="583" y="134" font-size="17" font-weight="700" text-anchor="start" class="">Local data and checks</text><path d="M680 158V1200" stroke="#c8d1da" stroke-dasharray="5 5"/><rect x="847" y="105" width="226" height="53" rx="3" fill="#edf3f8" stroke="#c8d1da"/><text x="863" y="134" font-size="17" font-weight="700" text-anchor="start" class="">External AI service</text><path d="M960 158V1200" stroke="#c8d1da" stroke-dasharray="5 5"/><rect x="30" y="180" width="1040" height="145" fill="#edf3f8" fill-opacity=".7" stroke="#c8d1da"/><text x="45" y="203" font-size="14" font-weight="700" text-anchor="start" class="">Optional: add a director note first</text><path d="M125 235 L400 235" stroke="#1670b7" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><text x="262.5" y="225" font-size="14" font-weight="400" text-anchor="middle" class="">Add a narrated event</text><path d="M400 277 L680 277" stroke="#1670b7" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><text x="540.0" y="267" font-size="14" font-weight="400" text-anchor="middle" class="">Check if enabled; record if allowed</text><text x="420" y="314" font-size="14" font-weight="400" text-anchor="start" class="muted">No AI call yet; waits for the next question</text><path d="M125 376 L400 376" stroke="#1670b7" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><text x="262.5" y="366" font-size="14" font-weight="400" text-anchor="middle" class="">Send the next message</text><path d="M400 420 L680 420" stroke="#1670b7" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><text x="540.0" y="410" font-size="14" font-weight="400" text-anchor="middle" class="">Check input, when filtering is enabled</text><rect x="30" y="444" width="1040" height="87" fill="#edf3f8" fill-opacity=".7" stroke="#c8d1da"/><text x="45" y="467" font-size="14" font-weight="700" text-anchor="start" class="">Branch: blocked input</text><path d="M680 500 L400 500" stroke="#1670b7" stroke-width="1.6" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="540.0" y="490" font-size="14" font-weight="400" text-anchor="middle" class="">Show a notice; do not send to AI</text><rect x="30" y="551" width="1040" height="156" fill="#edf3f8" fill-opacity=".7" stroke="#c8d1da"/><text x="45" y="574" font-size="14" font-weight="700" text-anchor="start" class="">Allowed: retrieve passages when a source book is linked</text><path d="M400 613 L680 613" stroke="#1670b7" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><text x="540.0" y="603" font-size="14" font-weight="400" text-anchor="middle" class="">Find passages for the current question</text><path d="M680 668 L400 668" stroke="#1670b7" stroke-width="1.6" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="540.0" y="658" font-size="14" font-weight="400" text-anchor="middle" class="">Return passages; omit if unavailable</text><text x="400" y="744" font-size="14" font-weight="400" text-anchor="middle" class="">Assemble character, passages, notes, history, question</text><path d="M400 790 L960 790" stroke="#1670b7" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><text x="680.0" y="780" font-size="14" font-weight="400" text-anchor="middle" class="">Request a reply</text><path d="M960 836 L400 836" stroke="#1670b7" stroke-width="1.6" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="680.0" y="826" font-size="14" font-weight="400" text-anchor="middle" class="">Stream reply text</text><path d="M400 879 L125 879" stroke="#1670b7" stroke-width="1.6" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="262.5" y="869" font-size="14" font-weight="400" text-anchor="middle" class="">Display progressively; user can stop</text><rect x="30" y="901" width="1040" height="96" fill="#edf3f8" fill-opacity=".7" stroke="#c8d1da"/><text x="45" y="924" font-size="14" font-weight="700" text-anchor="start" class="">After streaming: check output, then finalize text and scene feedback</text><path d="M400 953 L680 953" stroke="#1670b7" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><text x="540.0" y="943" font-size="14" font-weight="400" text-anchor="middle" class="">If enabled: keep, redact, or clear</text><rect x="30" y="1017" width="1040" height="125" fill="#edf3f8" fill-opacity=".7" stroke="#c8d1da"/><text x="45" y="1040" font-size="14" font-weight="700" text-anchor="start" class="">Errors and stopping</text><path d="M125 1068 L400 1068" stroke="#1670b7" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><text x="262.5" y="1058" font-size="14" font-weight="400" text-anchor="middle" class="">Stop → Cancel; retain received text*</text><path d="M400 1118 L125 1118" stroke="#1670b7" stroke-width="1.6" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="262.5" y="1108" font-size="14" font-weight="400" text-anchor="middle" class="">Request failure → Explain the error</text><text x="40" y="1194" font-size="14" font-weight="400" text-anchor="start" class="">* Received text still goes through applicable output checks and may be cleared or redacted.</text><text x="40" y="1225" font-size="14" font-weight="400" text-anchor="start" class="muted">Scope: based on chat, prompt, and retrieval code; streaming is not depicted as pre-screened output.</text></svg>