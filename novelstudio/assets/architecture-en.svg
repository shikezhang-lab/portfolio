e="14" font-weight="400" text-anchor="start" class="">StoreKit 2 / ProEntitlement</text><rect x="800" y="190" width="270" height="155" rx="3" fill="#edf3f8" stroke="#c8d1da"/><text x="816" y="219" font-size="17" font-weight="700" text-anchor="start" class="">User-selected AI service</text><text x="816" y="244" font-size="14" font-weight="400" text-anchor="start" class="">① Sample text → Characters</text><text x="816" y="269" font-size="14" font-weight="400" text-anchor="start" class="">② Chat context → Reply</text><text x="816" y="294" font-size="14" font-weight="400" text-anchor="start" class="">Usage paid by the user</text><path d="M360 299 L377 299 L377 252 L773 252 L798 227" stroke="#1670b7" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><text x="596" y="247" font-size="12" font-weight="400" text-anchor="middle" class="">Character extraction request</text><path d="M720 306 L798 267" stroke="#1670b7" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><path d="M800 324 L722 462" stroke="#1670b7" stroke-width="1.6" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="785" y="376" font-size="13" font-weight="400" text-anchor="middle" class="">Direct API</text><rect x="800" y="552" width="270" height="98" rx="3" fill="#edf3f8" stroke="#c8d1da"/><text x="816" y="581" font-size="17" font-weight="700" text-anchor="start" class="">Apple purchasing</text><text x="816" y="606" font-size="14" font-weight="400" text-anchor="start" class="">Purchase, restore, verification</text><text x="816" y="631" font-size="14" font-weight="400" text-anchor="start" class="">App benefits ≠ AI usage</text><path d="M720 610 L798 610" stroke="#1670b7" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><text x="45" y="725" font-size="15" font-weight="400" text-anchor="start" class="">Data: extraction samples and generation context go to the chosen AI service; no owned AI proxy.</text><text x="45" y="753" font-size="15" font-weight="400" text-anchor="start"