<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="810" viewBox="0 0 1100 810" role="img"><title>NovelStudio 产品架构</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#1670b7"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#071e3d}.muted{fill:#536273}</style><text x="35" y="45" font-size="26" font-weight="700" text-anchor="start" class="">产品架构 · 本地资料与外部 AI 的职责</text><text x="35" y="76" font-size="14" font-weight="400" text-anchor="start" class="muted">设计与代码模块示意；不代表送审版本的完整流程验收</text><rect x="30" y="102" width="720" height="585" fill="#f7f9fb" stroke="#c8d1da"/><text x="50" y="135" font-size="19" font-weight="700" text-anchor="start" class="">用户设备 / iOS App</text><rect x="55" y="158" width="665" height="78" rx="3" fill="#edf3f8" stroke="#c8d1da"/><text x="71" y="187" font-size="17" font-weight="700" text-anchor="start" class="">使用界面</text><text x="71" y="212" font-size="14" font-weight="400" text-anchor="start" class="">试用演示 · 角色管理 · 对话与导演模式 · 设置与付费</text><path d="M385 236 L385 267" stroke="#1670b7" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><rect x="55" y="275" width="305" height="98" rx="3" fill="#edf3f8" stroke="#c8d1da"/><text x="71" y="304" font-size="17" font-weight="700" text-anchor="start" class="">准备小说与角色</text><text x="71" y="329" font-size="14" font-weight="400" text-anchor="start" class="">FileImporter / CharacterExtractor</text><text x="71" y="354" font-size="14" font-weight="400" text-anchor="start" class="">文本解析、取样与结果保存</text><rect x="395" y="275" width="325" height="98" rx="3" fill="#edf3f8" stroke="#c8d1da"/><text x="411" y="304" font-size="17" font-weight="700" text-anchor="start" class="">组织对话与生成</text><text x="411" y="329" font-size="14" font-weight="400" text-anchor="start" class="">ChatViewModel / PromptAssembler</text><text x="411" y="354" font-size="14" font-weight="400" text-anchor="start" class="">角色设定 + 相关原文 + 旁白</text><rect x="55" y="435" width="305" height="98" rx="3" fill="#edf3f8" stroke="#c8d1da"/><text x="71" y="464" font-size="17" font-weight="700" text-anchor="start" class="">本地存储与检索</text><text x="71" y="489" font-size="14" font-weight="400" text-anchor="start" class="">DatabaseManager / SQLite FTS5</text><text x="71" y="514" font-size="14" font-weight="400" text-anchor="start" class="">书籍片段、角色、会话</text><rect x="395" y="435" width="325" height="98" rx="3" fill="#edf3f8" stroke="#c8d1da"/><text x="411" y="464" font-size="17" font-weight="700" text-anchor="start" class="">设备端内容处理</text><text x="411" y="489" font-size="14" font-weight="400" text-anchor="start" class="">LocalContentFilter / StreamConsumer</text><text x="411" y="514" font-size="14" font-weight="400" text-anchor="start" class="">输入检查、逐步展示、结束后检查</text><path d="M205 373 L205 433" stroke="#1670b7" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><path d="M360 483 L393 325" stroke="#1670b7" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><path d="M555 373 L555 433" stroke="#1670b7" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><rect x="55" y="573" width="305" height="78" rx="3" fill="#edf3f8" stroke="#c8d1da"/><text x="71" y="602" font-size="17" font-weight="700" text-anchor="start" class="">服务密钥</text><text x="71" y="627" font-size="14" font-weight="400" text-anchor="start" class="">Keychain</text><rect x="395" y="573" width="325" height="78" rx="3" fill="#edf3f8" stroke="#c8d1da"/><text x="411" y="602" font-size="17" font-weight="700" text-anchor="start" class="">购买与解锁</text><text x="411" y="627" font-size="14" font-weight="400" text-anchor="start" class="">StoreKit 2 / ProEntitlement</text><rect x="800" y="190" width="270" height="155" rx="3" fill="#edf3f8" stroke="#c8d1da"/><text x="816" y="219" font-size="17" font-weight="700" text-anchor="start" class="">用户选择的 AI 服务</text><text x="816" y="244" font-size="14" font-weight="400" text-anchor="start" class="">① 取样文本 → 提取角色</text><text x="816" y="269" font-size="14" font-weight="400" text-anchor="start" class="">② 对话上下文 → 生成回复</text><text x="816" y="294" font-size="14" font-weight="400" text-anchor="start" class="">调用费用由用户承担</text><path d="M360 299 L377 299 L377 252 L773 252 L798 227" stroke="#1670b7" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><text x="596" y="247" font-size="12" font-weight="400" text-anchor="middle" class="">角色提取请求</text><path d="M720 306 L798 267" stroke="#1670b7" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><path d="M800 324 L722 462" stroke="#1670b7" stroke-width="1.6" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="785" y="376" font-size="13" font-weight="400" text-anchor="middle" class="">直接连接</text><rect x="800" y="552" width="270" height="98" rx="3" fill="#edf3f8" stroke="#c8d1da"/><text x="816" y="581" font-size="17" font-weight="700" text-anchor="start" class="">Apple 购买服务</text><text x="816" y="606" font-size="14" font-weight="400" text-anchor="start" class="">购买、恢复与交易验证</text><text x="816" y="631" font-size="14" font-weight="400" text-anchor="start" class="">应用权益与 AI 费用分开</text><path d="M720 610 L798 610" stroke="#1670b7" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><text x="45" y="725" font-size="15" font-weight="400" text-anchor="start" class="">数据说明：生成和角色提取所需文本会发送给选定的 AI 服务；没有自建 AI 代理后端。</text><text x="45" y="753" font-size="15" font-weight="400" text-anchor="start" class="">过滤说明：设备端关键词过滤存在局限；输出检查发生在流式显示结束之后。</text><text x="45" y="781" font-size="14" font-weight="400" text-anchor="start" class="muted">完整导入到角色对话：有开发测试版试用反馈；当前主入口与该版本仍需对齐。</text></svg>